      padding: 0;
    }

    p, h2, span {
      color: #333;
    }

    button a {
      text-decoration: none;
      color: white;
    }

    button {
      background-color: #007bff;
      color: white;
      padding: 10px 25px;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      transition: 0.3s ease;
    }

    button:hover {
      background-color: #0056b3;
      transform: scale(1.1);
    }

    img {
      transition: transform 0.3s ease;
    }

    img:hover {
      transform: scale(1.1);
    }

    html {
      scroll-behavior: smooth;
    }

    .fade-in {
      opacity: 0;
      transition: opacity 1s ease-in;
    }

    .fade-in.visible {
      opacity: 1;
    }

    #scrollTopBtn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 99;
      display: none;
      font-size: 18px;
      background-color: #555;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    svg {

  <!-- JavaScript Section -->
  <script>
    // Typewriter
    const text = "Hi, I'm Vishal Kumar , QA Engineer in software testing and quality assurance, skilled in manual and automated testing processes. Proficient in creating and executing test cases, identifying bugs, and ensuring software meets user requirements. Experienced with tools like Selenium,TestNG , and well-versed in Agile and Scrum methodologies.";
    let i = 0;
    const speed = 50;
    function typeWriter() {
      if (i < text.length) {
        document.getElementById("intro-text").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, speed);
      }
    }
    typeWriter();

    // Scroll-to-top visibility
    const btn = document.getElementById("scrollTopBtn");
    window.onscroll = function () {
      btn.style.display = (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) ? "block" : "none";

      // Scroll Fade-in
      document.querySelectorAll('.fade-in').forEach(function (el) {
        const top = el.getBoundingClientRect().top;
        if (top < window.innerHeight) {
          el.classList.add('visible');
        }
      });
    };

    function topFunction() {
      document.body.scrollTop = 0;
      document.documentElement.scrollTop = 0;
    }
  </script>
